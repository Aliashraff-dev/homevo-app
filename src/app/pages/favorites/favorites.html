<app-header></app-header>

<div class="favorites-container">
  <h1 class="favorites-title">My Favorites</h1>

  <div *ngIf="favorites.length === 0" class="empty-favorites">
    <i class="fa-regular fa-heart"></i>
    <p>No favorites yet. Start adding products you love!</p>
    <a routerLink="/collection" class="browse-btn">Browse Collection</a>
  </div>

  <div *ngIf="favorites.length > 0" class="favorites-grid">
    <div *ngFor="let product of favorites" class="fav-card">
      <div class="fav-img-wrap">
        <img [src]="product.image" [alt]="product.name">
        <button class="remove-fav-btn" (click)="removeFromFavorites(product.id)">
          <i class="fa-solid fa-heart"></i>
        </button>
      </div>
      <div class="fav-info">
        <h3>{{ product.name }}</h3>
        <span class="fav-price">${{ product.price }}</span>
        <div class="fav-actions">
          <a [routerLink]="['/product']" [queryParams]="{id: product.id}" class="details-btn">Details</a>
          <button class="add-cart-btn" (click)="addToCart(product)">Add To Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
