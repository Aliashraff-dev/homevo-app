<app-header></app-header>

<div class="cart-container">
  <h2>Your Cart</h2>

  <div id="cart-items-container">
    <!-- تم إضافة الشرط لتغيير لون النص للأحمر لو isCartEmptyError بقت true -->
    <p *ngIf="cart.length === 0" [style.color]="isCartEmptyError ? 'red' : 'inherit'">Your cart is empty.</p>
    
    <div *ngFor="let item of cart; let i = index" class="cart-item">
      
      <div>
        <h4 style="margin: 0 0 5px 0;">{{ item.name }}</h4>
        <small style="color: #666;">${{ item.price }} / piece</small>
      </div>

      <div class="cart-item-actions">
        
        <div class="qty-controls">
          <button (click)="decreaseQuantity(i)" style="padding: 2px 8px; cursor: pointer; border: none; background: none; font-weight: bold;">-</button>
          <span class="qty-value">{{ item.quantity }}</span>
          <button (click)="increaseQuantity(i)" style="padding: 2px 8px; cursor: pointer; border: none; background: none; font-weight: bold;">+</button>
        </div>

        <span class="item-subtotal">${{ item.price * item.quantity }}</span>

        <button (click)="removeFromCart(i)" class="remove-item-btn">Remove</button>
      </div>

    </div>
  </div>

  <div class="checkout-box">
    <h3>Total: ${{ total }}</h3>
    <!-- تم تحويل الرابط إلى زر يستدعي دالة processOrder لتنفيذ الشروط -->
    <button (click)="processOrder()" id="checkout-btn" style="display: inline-block; text-align: center; text-decoration: none; line-height: normal; cursor: pointer; border: none;">
      Place Order
    </button>
  </div>
</div>

<app-footer></app-footer>
