<app-admin-sidebar></app-admin-sidebar>

<main class="admin-main">
  <div class="page-header">
    <h1 class="page-title">Edit Product</h1>
    <a class="back-btn" routerLink="/admin/products">Back to Products</a>
  </div>

  <div *ngIf="sessionExpiredMessage" class="error-banner">{{ sessionExpiredMessage }}</div>
  <div *ngIf="loading" class="status-msg">Loading product...</div>

  <form *ngIf="!loading" (ngSubmit)="onSubmit()" class="product-form">
    <div *ngIf="errors.general" class="error-banner">{{ errors.general }}</div>
    <div *ngIf="successMessage" class="success-banner">{{ successMessage }}</div>

    <div class="form-group">
      <label>Product Name</label>
      <input type="text" [(ngModel)]="product.name" name="name" />
      <small class="error-text" *ngIf="errors.name">{{ errors.name }}</small>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea rows="3" [(ngModel)]="product.description" name="description"></textarea>
      <small class="error-text" *ngIf="errors.description">{{ errors.description }}</small>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Price</label>
        <input type="number" [(ngModel)]="product.price" name="price" />
        <small class="error-text" *ngIf="errors.price">{{ errors.price }}</small>
      </div>

      <div class="form-group">
        <label>Stock Quantity</label>
        <input type="number" [(ngModel)]="product.stockQuantity" name="stockQuantity" />
        <small class="error-text" *ngIf="errors.stockQuantity">{{ errors.stockQuantity }}</small>
      </div>
    </div>

    <div class="form-group">
      <label>Category</label>
      <select [(ngModel)]="product.categoryId" name="categoryId">
        <option [ngValue]="0">Select category</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
      </select>
      <small class="error-text" *ngIf="errors.categoryId">{{ errors.categoryId }}</small>
    </div>

    <div class="form-group">
      <label>Image URL</label>
      <input type="text" [(ngModel)]="product.imageUrl" name="imageUrl" />
      <small class="error-text" *ngIf="errors.imageUrl">{{ errors.imageUrl }}</small>
    </div>

    <div class="form-group checkbox-group">
      <label>
        <input type="checkbox" [(ngModel)]="product.isFeatured" name="isFeatured" />
        Featured Product
      </label>
    </div>

    <button type="submit" class="submit-btn" [disabled]="submitting">
      {{ submitting ? "Saving..." : "Save Changes" }}
    </button>
  </form>
</main>
